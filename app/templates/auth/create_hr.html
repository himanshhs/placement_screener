{% extends "base.html" %}
{% block title %}Create HR Login{% endblock %}
{% block content %}
<h1>Create company HR login</h1>
<div class="card mt1" style="max-width:500px">
  <form method="POST">
    <label>Full name</label><input type="text" name="full_name" required>
    <label>Email</label><input type="email" name="email" required>
    <label>Password</label><input type="password" name="password" required>
    <label>Assign to drive</label>
    <select name="drive_id">
      {% for d in drives %}
        <option value="{{ d.id }}">{{ d.company_name }} — {{ d.role_title }}</option>
      {% endfor %}
    </select>
    <button class="btn btn-primary">Create login</button>
  </form>
</div>
{% endblock %}
