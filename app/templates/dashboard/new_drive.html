{% extends "base.html" %}
{% block title %}New Drive — PlaceIQ{% endblock %}
{% block topbar_title %}New drive{% endblock %}
{% block content %}
<div style="max-width:680px">
  <p class="muted mb-1">Upload or paste the job description — weights will be auto-suggested from the JD content.</p>
  <div class="card">
    <form method="POST" enctype="multipart/form-data">
      <div class="grid-2">
        <div>
          <label>Company name</label>
          <input type="text" name="company_name" required placeholder="e.g. Google">
        </div>
        <div>
          <label>Role title</label>
          <input type="text" name="role_title" placeholder="e.g. SWE Intern">
        </div>
      </div>
      <label>Shortlist count</label>
      <input type="number" name="shortlist_count" value="50" min="1" max="500" style="width:140px">
      <label style="margin-top:0.5rem">Job description — paste text</label>
      <textarea name="jd_text" rows="9" placeholder="Paste the full job description here. The system will analyse it and suggest weights automatically..."></textarea>
      <label>Or upload JD as PDF</label>
      <input type="file" name="jd_file" accept=".pdf" style="border-radius:8px">
      <button class="btn btn-primary" style="margin-top:0.75rem;padding:0.6rem 1.5rem">
        Analyse JD and suggest weights →
      </button>
    </form>
  </div>
</div>
{% endblock %}
